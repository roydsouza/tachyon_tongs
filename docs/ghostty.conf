# Ghostty:# Tachyon Tongs: Ghostty Optimized Profile
# Optimized for Phase 24: Event-Horizon Command Bridge

theme = dark:Tokyo Night, light:Dayfox
font-family = "JetBrainsMono Nerd Font"
font-size = 13

# Rendering & Aesthetics
background-opacity = 0.95
background-blur-radius = 20
cursor-style = block
cursor-blink = true

# Situational Awareness Markers
window-title-font-family = "JetBrainsMono Nerd Font"
title = "🛰️ Tachyon Substrate"

# Keybindings for Command Bridge
keybind = super+t=new_window
keybind = super+d=text:tt dash\r
keybind = super+r=text:tt ritual\r
keybind = super+s=text:tt status\r

# OSC 8/9 Support (Default is auto, but explicit for clarity)
term = xterm-256color
window-decoration = true
confirm-close-surface = true

# Advanced: Nerd Font Symbols for Manifolds
# 🛰️ Tactical  🤖 Agents  📟 Feed  🧤 Airlock  🔒 Vault

# Performance & Rendering
gpu-renderer = true
repaint-delay = 0
vsync = true

# Aesthetic: Tachyon Dark (Metal 4 Optimized)
background = 0a0e14
foreground = e6e6e6

# Semantic Palette (Threat Levels)
palette = 0=1a1a2e     # Black (Substrate BG)
palette = 1=f07178     # Red (CRITICAL / ALERT)
palette = 2=c3e88d     # Green (OPERATIONAL / APPROVED)
palette = 3=ffcb6b     # Yellow (WARNING / PENDING)
palette = 4=82aaff     # Blue (INFO / AGENT)
palette = 5=c792ea     # Magenta (DEBATE / REASONING)
palette = 6=89ddff     # Cyan (HIGHLIGHT)
palette = 7=d6deeb     # White (TEXT)

# Navigation & Bounding
keybind = ctrl+shift+t=new_tab:tt dash
keybind = ctrl+shift+a=new_tab:tt airlock list
keybind = ctrl+shift+l=new_tab:tt logs tail

# Shell Integration
shell-integration = true
osc9-notifications = true

# Font Optimization
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-feature = -calt, -liga
